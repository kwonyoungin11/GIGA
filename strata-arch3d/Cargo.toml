[workspace]
resolver = "2"
members = [
    "crates/strata-core",
    "crates/strata-io",
    "crates/strata-orient",
    "crates/strata-measure",
    "crates/strata-section",
    "crates/strata-shade",
    "crates/strata-export",
    "crates/strata-studio",
]

[workspace.package]
version = "2.0.0"
edition = "2021"
license = "Proprietary"
authors = ["Dongguk Cultural Heritage Research Institute · STRATA Engineering Team"]

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "warn"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
rayon = "1.10"
kurbo = "0.11"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
eframe = { version = "0.31", features = ["wgpu", "glow"] }
egui = "0.31"
wgpu = { version = "24.0.5", default-features = false, features = ["wgsl"] }
rfd = "0.15"
strata-core = { path = "crates/strata-core" }
strata-io = { path = "crates/strata-io" }
strata-orient = { path = "crates/strata-orient" }
strata-measure = { path = "crates/strata-measure" }
strata-section = { path = "crates/strata-section" }
strata-shade = { path = "crates/strata-shade" }
strata-export = { path = "crates/strata-export" }
