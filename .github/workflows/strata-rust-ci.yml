name: STRATA DongArch3D Rust CI (V1-V8 Harness)

on:
  push:
    branches: [master, main, "feat/**", "factory/**"]
    paths:
      - "strata-arch3d/**"
      - "docs/ui/**"
      - ".github/workflows/strata-rust-ci.yml"
  pull_request:
    branches: [master, main]
    paths:
      - "strata-arch3d/**"
      - "docs/ui/**"
      - ".github/workflows/strata-rust-ci.yml"
  workflow_dispatch:

concurrency:
  group: strata-rust-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # 릴리스 프로파일(LTO fat·codegen-units=1)은 로컬 PC 기준 2~3분. CI 캐시가 있으면 단축된다.
  CARGO_INCREMENTAL: "0"

jobs:
  rust-harness-verify:
    name: Rust 1.91.1 · Clippy (-D warnings) · V1-V8 Harness · 8-Mode Plate Shots
    runs-on: windows-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 저장소의 strata-arch3d/rust-toolchain.toml(channel 1.91.1, rustfmt·clippy)과
      # 로컬 개발 환경을 동일하게 맞춘다. toolchain 을 명시하면 CI 러너의 기본 stable 로
      # 올라타 버전이 어긋나는 일이 없다.
      - name: Install pinned Rust toolchain (rust-toolchain.toml)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.91.1"
          components: rustfmt, clippy

      - name: Cache Cargo registry, git db and target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "strata-arch3d -> target"
          # 프로파일(dev 의존성 opt-level=2, release LTO)이 바뀌면 캐시 키도 바뀐다.
          key: strata-rust-${{ hashFiles('strata-arch3d/Cargo.toml', 'strata-arch3d/.cargo/config.toml') }}

      - name: "[V1] Format + Check + Clippy zero warnings"
        working-directory: strata-arch3d
        run: |
          cargo fmt --all -- --check
          cargo check --workspace --all-targets --locked
          cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: "[V2-V7] Full workspace test suite (Core, IO, Orient, Measure, Section, Shade, Export, Studio)"
        working-directory: strata-arch3d
        run: |
          cargo test --workspace --locked -- --nocapture

      - name: "[V8] Headless harness + canonical UI/plate capture"
        working-directory: strata-arch3d
        run: |
          $shotDir = "target/ci-shots"
          New-Item -ItemType Directory -Force -Path $shotDir | Out-Null
          # 이전 워크플로는 존재하지 않는 패키지 이름(arch3d-studio)을 호출해 항상 실패했다.
          cargo run --release --locked -p strata-studio -- --verify-all --screenshot-tour "$shotDir"
          # PNG 는 1,000B 이상, CSV/SVG 같은 텍스트 산출물은 0B 만 아니면 통과(작은 표 산출물이 정상).
          Get-ChildItem "$shotDir/*" -File | ForEach-Object {
            if ($_.Length -eq 0) { throw "Artifact $($_.Name) is empty" }
            if ($_.Extension -match '^\.(png|jpg|jpeg)$' -and $_.Length -lt 1000) {
              throw "Image $($_.Name) is unexpectedly small ($($_.Length) bytes)"
            }
          }

      - name: Upload STRATA Rust verification artifacts (PNG, SVG, DXF, PDF, harness report)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: strata-arch3d-rust-verification
          retention-days: 14
          path: |
            strata-arch3d/target/ci-shots/*
